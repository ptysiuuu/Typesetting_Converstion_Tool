[build-system]
requires = ["scikit-build-core>=0.10.0"]
build-backend = "scikit_build_core.build"

[project]
name = "typesetting-conversion-tool"
version = "0.1.0"
description = "Convert GitHub Flavored Markdown to LaTeX or Typst via a C++23 core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.scikit-build]
cmake.args = [
    "-DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake",
    "-DCMAKE_PREFIX_PATH=build",
    "-DCMAKE_BUILD_TYPE=Release",
	"-DCMAKE_CXX_COMPILER=clang++-18",
    "-DCMAKE_C_COMPILER=clang-18"
]
editable.mode = "redirect"

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pytest>=9.0.3",
    "ruff>=0.4.0",
]

# Black
[tool.black]
line-length = 88
target-version = ["py311"]

# Ruff
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, UP = pyupgrade
select = ["E", "W", "F", "I", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["converter_bindings"]

# Pytest
[tool.pytest.ini_options]
testpaths = ["tests/python"]
